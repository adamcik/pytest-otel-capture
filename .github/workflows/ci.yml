name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: adamcik/nix-tooling/actions/nix-setup@03474cbd37cedc82f533d69a65cdd23237b5798e
      - run: nix fmt -- --ci
      - run: nix flake check
      - name: Inspect release distributions
        uses: hynek/build-and-inspect-python-package@8219e97fa5848d0e0fb514054f36a08467416828 # main
        with:
          python-version: "3.12"

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        otel:
          - sdk: "1.43.0"
            instrumentation: "0.64b0"
          - sdk: "1.44.0"
            instrumentation: "0.65b0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: adamcik/nix-tooling/actions/nix-setup@03474cbd37cedc82f533d69a65cdd23237b5798e
      - name: Build and install the wheel with exact SDK versions
        run: |
          nix develop --command python -m build --no-isolation
          nix develop --command env UV_NO_MANAGED_PYTHON=false UV_PYTHON_DOWNLOADS=automatic \
            uv venv --python '${{ matrix.python }}' .compat
          nix develop --command uv pip install --python .compat/bin/python dist/*.whl \
            'opentelemetry-api==${{ matrix.otel.sdk }}' \
            'opentelemetry-sdk==${{ matrix.otel.sdk }}' \
            'opentelemetry-instrumentation-logging==${{ matrix.otel.instrumentation }}' \
            pytest pytest-xdist build hatchling hatch-vcs editables packaging
          nix develop --command uv pip check --python .compat/bin/python
      - name: Test the installed wheel and check types against the selected SDK
        env:
          EXPECTED_OTEL_SDK: ${{ matrix.otel.sdk }}
          EXPECTED_INSTRUMENTATION: ${{ matrix.otel.instrumentation }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          .compat/bin/python - <<'PY'
          import importlib.metadata as metadata
          import os
          import sys
          import pytest_otel_capture as capture

          assert metadata.version("opentelemetry-api") == os.environ["EXPECTED_OTEL_SDK"]
          assert metadata.version("opentelemetry-sdk") == os.environ["EXPECTED_OTEL_SDK"]
          assert metadata.version("opentelemetry-instrumentation-logging") == os.environ["EXPECTED_INSTRUMENTATION"]
          assert sys.version_info[:2] == tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          assert "site-packages" in capture.__file__
          PY
          .compat/bin/python -m pytest -q -n 2
          nix develop --command basedpyright --pythonpath "$PWD/.compat/bin/python"
