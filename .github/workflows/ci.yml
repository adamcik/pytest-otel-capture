name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: adamcik/nix-tooling/actions/nix-setup@03474cbd37cedc82f533d69a65cdd23237b5798e
      - run: nix fmt -- --ci
      - run: nix flake check
      - name: Test latest compatible dependencies
        # Resolve independently of uv.lock; the Nix checks still test the locked set.
        run: |
          nix shell --inputs-from . nixpkgs#uv nixpkgs#python312 --command \
            uv run --no-project --isolated --upgrade \
            --python python3.12 --no-python-downloads \
            --with-editable . --with 'pytest>=9,<10' --with pytest-xdist \
            pytest -q -n 2
      - name: Inspect release distributions
        uses: hynek/build-and-inspect-python-package@8219e97fa5848d0e0fb514054f36a08467416828 # main
        with:
          python-version: "3.12"
