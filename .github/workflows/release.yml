name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: adamcik/nix-tooling/actions/nix-setup@03474cbd37cedc82f533d69a65cdd23237b5798e
      - run: nix fmt -- --ci
      - run: nix flake check
      - uses: hynek/build-and-inspect-python-package@a75f00e4b4f7a8b6376eb3170c98e0bfb5dfeb93 # main
        id: build
        with:
          python-version: "3.12"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DIST_DIR: ${{ steps.build.outputs.dist }}
        run: nix develop --command python scripts/check-release.py

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-otel-capture/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
